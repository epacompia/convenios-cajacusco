quarkus.http.port=8080
quarkus.application.name=chn-base-backend

# Formato de log con identificador de trazabilidad por peticion (X-Request-Id)
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [%X{recaudacion.traceId}] %s%e%n
# Nivel base de la aplicacion (cada perfil lo sobreescribe en application-<perfil>.properties)
quarkus.log.category."org.canalesCMAC".level=INFO
%test.quarkus.log.category."org.canalesCMAC".level=DEBUG

# Resiliencia (timeouts globales del cliente HTTP de Camel)
camel.component.http.connectTimeout=15000
camel.component.http.soTimeout=15000
# Reintentos por defecto (0 = sin reintentos; subir con cuidado en pagos).
# Se pueden sobreescribir por convenio con convenio.<X>.reintentos / .reintentos.delay
recaudacion.reintentos=0
recaudacion.reintentos.delay=500
# Timeout por convenio opcional (ms): convenio.<X>.timeout. Si se omite usa el global de Camel.
recaudacion.timeout=0

# Registro de convenios (escalable: agregar un convenio = agregar estas propiedades
# + un MapeadorOperacion para su formato; ya no hace falta un adapter por convenio)
convenio.ELSE.operadores=CONSULTA_DEUDA,PAGO_DEUDA,CONSULTA_PAGO,EXTORNO_PAGO
convenio.ELSE.protocolo=soap
convenio.ELSE.auth=ninguna
convenio.ELSE.url=${ELSE_URL:https://appsrvdev.else.com.pe/wApiCobranzaLinea/SCobranza.svc}

convenio.ELECTRO_UCAYALI.operadores=CONSULTA_DEUDA,PAGO_DEUDA,EXTORNO_PAGO,EXTORNO_PAGO_AUTO,EXTORNO_AUTO
convenio.ELECTRO_UCAYALI.protocolo=rest
convenio.ELECTRO_UCAYALI.auth=bearer
convenio.ELECTRO_UCAYALI.url=${ELECTRO_UCAYALI_URL:https://servicios.electroucayali.com.pe/WSFinancieraApiElectro}

convenio.SEAL.operadores=CONSULTA_DEUDA,PAGO_DEUDA,EXTORNO_PAGO,ANULACION
convenio.SEAL.protocolo=iso8583
convenio.SEAL.auth=ninguna
convenio.SEAL.url=${SEAL_URL:http://localhost:8080/seal}

convenio.CLARO.operadores=PAGO_DEUDA
convenio.CLARO.protocolo=soap
convenio.CLARO.auth=ninguna
convenio.CLARO.url=${CLARO_URL:http://localhost:8088/mockServiciosClaro}

convenio.UNIVCUSCO.operadores=CONSULTA_DEUDA
convenio.UNIVCUSCO.protocolo=soap
convenio.UNIVCUSCO.auth=ninguna
convenio.UNIVCUSCO.url=${UNIVCUSCO_URL:http://localhost:8089/mockRecaudosSoapBinding}

convenio.YAGANASTE.operadores=CONSULTA,SALDO
convenio.YAGANASTE.protocolo=soap
convenio.YAGANASTE.auth=ninguna
convenio.YAGANASTE.url=${YAGANASTE_URL:http://localhost:8090/mockSigmaService}

convenio.MUNICIPALIDAD_CUSCO.operadores=CONSULTA_DEUDA
convenio.MUNICIPALIDAD_CUSCO.protocolo=rest
convenio.MUNICIPALIDAD_CUSCO.auth=ninguna
convenio.MUNICIPALIDAD_CUSCO.url=${MUNICIPALIDAD_CUSCO_URL:https://2647ca93-164c-44db-aa7f-0c4f997e5bb1.mock.pstmn.io/api/servicio/recuperar_orden_pago}

convenio.PAYTOPERU.operadores=CONSULTA_PAGO
convenio.PAYTOPERU.protocolo=rest
convenio.PAYTOPERU.auth=ninguna
convenio.PAYTOPERU.url=${PAYTOPERU_URL:http://desarrollo.paytoperu.com/cmac/consulta_pago}

# Operaciones ISO8583 de SEAL (datos, no código)
convenio.SEAL.operacion.CONSULTA_DEUDA.mti=0200
convenio.SEAL.operacion.CONSULTA_DEUDA.processingCode=310000
convenio.SEAL.operacion.CONSULTA_DEUDA.conMonto=false
convenio.SEAL.operacion.CONSULTA_DEUDA.requiereAprobacion=false
convenio.SEAL.operacion.PAGO_DEUDA.mti=0200
convenio.SEAL.operacion.PAGO_DEUDA.processingCode=210000
convenio.SEAL.operacion.PAGO_DEUDA.conMonto=true
convenio.SEAL.operacion.PAGO_DEUDA.requiereAprobacion=false
convenio.SEAL.operacion.ANULACION.mti=0200
convenio.SEAL.operacion.ANULACION.processingCode=220000
convenio.SEAL.operacion.ANULACION.conMonto=false
convenio.SEAL.operacion.ANULACION.requiereAprobacion=true
convenio.SEAL.operacion.EXTORNO_PAGO.mti=0400
convenio.SEAL.operacion.EXTORNO_PAGO.processingCode=210000
convenio.SEAL.operacion.EXTORNO_PAGO.conMonto=false
convenio.SEAL.operacion.EXTORNO_PAGO.requiereAprobacion=false

# Normalizacion de codigos de respuesta (codigo del proveedor = mensaje canonico)
convenio.SEAL.codigo.00=TRANSACCION CORRECTA
convenio.SEAL.codigo.06=FORMATO DE MENSAJE INVALIDO
convenio.SEAL.codigo.07=CONTRATO NO ESTA DISPONIBLE PARA SER PAGADO
convenio.SEAL.codigo.20=SIN PAGO PARA EXTORNAR

# Credenciales (sobreescribir por variables de entorno en prod)
recaudacion.electrosureste.usuario=${ELSE_USUARIO:usuarioentidadfinan}
recaudacion.electrosureste.clave=${ELSE_CLAVE:124@abc}
recaudacion.electrosureste.soap.namespace=http://tempuri.org/

recaudacion.electroucayali.usuario=${ELECTRO_UCAYALI_USUARIO:user}
recaudacion.electroucayali.clave=${ELECTRO_UCAYALI_CLAVE:password}
recaudacion.electroucayali.codempresa=05

# SEAL (ISO8583)
recaudacion.seal.usuario=${SEAL_USUARIO:INTERBA}
recaudacion.seal.car=9999
recaudacion.seal.acquirer=40001000
recaudacion.seal.forward=20013005
recaudacion.seal.moneda=604
recaudacion.seal.agencia=015
recaudacion.seal.direccion=Av. Carlos Villaran 140 - La Victoria
